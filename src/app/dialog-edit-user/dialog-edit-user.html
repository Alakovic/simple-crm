<div class="dialog">
  @if (isLoading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
  <h2 mat-dialog-title class="dialog__title">Edit User</h2>
  <mat-dialog-content>
    <div class="dialog__name-fields">
      <mat-form-field appearance="outline">
        <mat-label>First Name</mat-label>
        <input
          [disabled]="isLoading()"
          matInput
          placeholder="Enter your first name"
          [(ngModel)]="user.firstName"
        />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Last Name</mat-label>
        <input
          [disabled]="isLoading()"
          matInput
          placeholder="Enter your last name"
          [(ngModel)]="user.lastName"
        />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="dialog__email">
      <mat-label>Email</mat-label>
      <input
        [disabled]="isLoading()"
        matInput
        placeholder="Enter your email"
        [(ngModel)]="user.email"
      />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button class="dialog__cancel-button" matButton (click)="dialog.close()">Cancel</button>
    <button class="dialog__save-button" matButton cdkFocusInitial (click)="saveUser()">Save</button>
  </mat-dialog-actions>
</div>
