<mat-card class="user-detail-header">
   <button class="menu-button-user" matIconButton [matMenuTriggerFor]="userMenu">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="editUserDetail()">Edit</button>
    </mat-menu>
  <img src="assets/img/profile.png" />
  <div class="user-details">
    <h2>{{ userService.selectedUser().firstName }} {{ userService.selectedUser().lastName }}</h2>
    <p>{{ userService.selectedUser().email }}</p>
  </div>
</mat-card>

<mat-card class="user-detail-card">
  <mat-card-header>
    <mat-card-title>Address</mat-card-title>
    <button class="menu-button" matIconButton [matMenuTriggerFor]="addressMenu" >
      <mat-icon>more_vert</mat-icon>
    </button>

    <mat-menu #addressMenu="matMenu">
      <button mat-menu-item (click)="editMenu()">Edit</button>
    </mat-menu>
  </mat-card-header>
  <mat-card-content>
    {{ userService.selectedUser().street }} <br />
    {{ userService.selectedUser().zipCode }} {{ userService.selectedUser().city }}
  </mat-card-content>
</mat-card>
